# Model Assumptions: Life Cycle Assessment (LCA)
#
# Cradle-to-gate 100-year global warming potential (GWP100), kg CO2-eq per kg
# of material unless noted. Scope and conventions are documented in
# sabre/_lca.py. Every value below is a PLACEHOLDER taken from another
# biorefinery in this repo, not a Sargassum- or 3-HP-specific life cycle
# inventory: see the `sources` notes for what each one is and how reliable.

gwp100:
  # Feedstock: collected nuisance Sargassum is assumed to arrive with no
  # environmental burden (as it arrives at zero price in data/tea.yaml).
  # Harvest and transport are NOT included; set a per-kg-wet value here to test it.
  sargassum_kg_CO2e_per_kg_wet: 0.0

  electricity_kg_CO2e_per_kWh: 0.48  # same value for grid electricity consumed and for exported electricity displacing the grid
  enzyme: 2.24
  lime: 0.9764  # as Ca(OH)2: 1.29 kg CO2e/kg CaO x 56.0774/74.093
  methane_upstream: 0.40  # natural gas supply chain, per kg CH4; combustion CO2 is added from stoichiometry
  ammonia: 2.64  # as NH3
  sulfuric_acid: 0.04447  # per kg of H2SO4 (baseline and pretreatment_press scenarios); charged on the H2SO4 content of the solution
  sodium_chloride: 0.043  # per kg NaCl (baseline scenario pretreatment); rock salt, cradle-to-gate A1-A3 (EPD Norway, GC Rieber, 0.035-0.043 kg CO2e/kg; sea salt 0.057). Transport to the plant is not included; vacuum-pan salt would be higher. Ecoinvent values were behind a paywall and not read.

  # Water, facility chemicals and waste handling (added so every inlet and every
  # liquid/solid outlet of the system carries an impact).
  process_water: 0.00035559  # kg CO2e per kg tap/process water (conventional treatment)
  cooling_tower_chemicals: 0.56  # per kg; sodium bicarbonate proxy for corrosion inhibitor
  boiler_chemicals: 2.05  # per kg; sodium hydroxide proxy
  wastewater_treatment: 0.0005  # per kg of liquid waste leaving the plant (0.5 kg CO2e/m3)
  ash_disposal: 0.0  # per kg of wet boiler ash; user-specified: no GHG emission

  sources:
    reused_from_lactic:
      key: biorefineries.lactic._process_settings.GWP_CFs
      note: "All values except the feedstock come from the lactic biorefinery's GWP_CFs (itself 'all from ref [3]' in that file; electricity 0.48 kg CO2e/kWh, 'NA NG from shale and conventional recovery' for methane). The lactic file notes that it is unclear whether in-plant receiving and preprocessing of feedstock are included."
    enzyme:
      key: placeholder_flagged
      note: "2.24 kg CO2e/kg enzyme is lactic's value; lactic's own comment says an ecoinvent value would be ~12.24, i.e. about 5x higher. At the ASPECT enzyme cap of 25 mg/g dry biomass, the enzyme is the largest single burden, so this factor matters most. Replace with a value for a cellulase + alginate lyase cocktail."
    electricity:
      key: placeholder_flagged
      note: "0.48 kg CO2e/kWh is a fixed US-grid-like value, assumed for both consumption and export. The net exported electricity credit therefore uses the same factor; results are reported with and without it."
    water_and_facility_chemicals:
      key: biorefineries.oleochemicals.prices_and_GWP_factors.Utility_GWP_factors
      note: "process_water 0.00035559 (tap water production, conventional treatment), cooling_tower_chemicals 0.56 (sodium bicarbonate proxy, GREET 2023) and boiler_chemicals 2.05 (NaOH proxy), as used in the oleochemicals biorefinery. Not checked against the original sources."
    wastewater_treatment:
      key: placeholder_flagged
      note: "0.0005 kg CO2e/kg (0.5 kg CO2e/m3) is mid-range of published municipal wastewater-treatment LCAs (about 0.1-1 kg CO2e/m3). The mother-liquor purge and permeate carry sugars and salts, so their real burden may be much higher, and the clean evaporator condensates much lower. Applied to every liquid stream the model prices as wastewater."
    ash_disposal:
      key: user_specified
      note: "Boiler ash is assumed to carry no GHG emission (0 kg CO2e/kg). Its disposal cost is still charged through the boiler utility (data/tea.yaml price.disposal_solid)."
    sargassum:
      key: user_specified
      note: "Zero burden for collected Sargassum; harvest, transport and any drying/stabilization are out of scope."
