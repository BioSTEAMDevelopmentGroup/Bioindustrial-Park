# Model Assumptions: 3-HP Fermentation and Crystallization

# Overrides sabre.units._preprocessing's EnzymaticPress instance in
# systems/_3hp_system.py only.
press_cake_solids_wt_frac_override: 0.27  # see sources below

sources:
  press_cake_solids_wt_frac:
    key: preprocessing_yaml_own_citation
    note: >
      data/preprocessing.yaml's own press.sources.performance citation
      (Vincent Corporation seaweed pressing notes) says "Sargassum-specific
      pressing data indicate cake solids around 26-29 wt% TS; 27 wt% TS
      selected as central baseline". 0.27 is applied here as an override.


pressate_concentrator:
  # Retargets sabre.units.PressateConcentrator at the EnzymaticPress pressate's
  # fermentable sugars (Glucose, Mannitol, AlginateMonomer).
  enabled: true
  retained_solute_IDs: [Glucose, Mannitol, AlginateMonomer]
  water_recovery_to_permeate: 0.93  # same basis as biostimulant.yaml's own instance
  retained_solute_recovery_to_concentrate: 0.95  # same basis as biostimulant.yaml's own instance
  nontarget_solute_recovery_to_permeate: 0.70  # no reference; same placeholder as biostimulant.yaml
  design_flux_L_m2_h: 35.0  # same basis as biostimulant.yaml's own instance
  operating_pressure_bar: 5.0
  electricity_kWh_per_m3_feed: 2.5
  capex_usd_per_m2: 500.0
  maintenance_frac_of_capex_per_yr: 0.035
  F_BM: 1.0  # capex already installed

  sources:
    reused_from_biostimulant:
      key: same_membrane_physics
      note: "Flux/electricity/capex/maintenance bases are the same UF membrane literature already cited in data/biostimulant.yaml's pressate_concentrator section (Sievers et al. 2017, Diaz-Reinoso and Dominguez 2020, Sethi and Wiesner 2000, Nguyen and Yoshikawa 2020, Cheryan 1998)."


fermentation_feed_evaporator:
  target_solids_wt_frac: 0.20
  boiling_temperature_K: 333.15  # mild vacuum evaporation ~60 C; same basis as biostimulant.yaml
  condensing_temperature_K: 310.15  # ~37 C; same basis as biostimulant.yaml
  nonwater_recovery_to_product: 1.0  # not 0.995 like biostimulant.yaml's own instance
  tau: 0.25  # hr; nominal vessel holdup time; no literature/prior-yaml grounding
  vacuum_system_preference: "Liquid-ring pump"

  sources:
    target_concentration:
      key: HP_precedent
      note: "biorefineries.HP.units.EnzymeHydrolysateMixer targets solid_loading=0.20 for its own pre-fermentation hydrolysate; reused here as the 'concentration match' requested for this pathway's fermentation feed."
    nonwater_recovery:
      key: bugfix
      note: "1.0 (not biostimulant.yaml's 0.995) so raw_vapor carries pure Water only."


broth_evaporator:
  # bst.units.MultiEffectEvaporator instantiation, concentrating the cell-mass-free fermentation broth to the
  # patent's crystallization threshold before CaHPCrystallizer.
  target_product_concentration_g_per_L: 450.0  # midpoint of the patent's 300-600 g/L crystallization threshold, solubility noted as 450 g/L in the patent
  P_Pa: [101325, 69682, 47057, 30953]  # same 4-effect pressure profile as systems._microbial_oil_system's fermentation-broth multi-effect evaporator
  V: 0.90  # initial guess; overridden by the bisection specification at simulation time

  sources:
    target_concentration:
      key: user_specified_patent
      note: "Patent reports 300-600 g/L as the crystallization-feed 3-HP(salt) concentration range; 450 g/L (midpoint) selected as the target."
    effect_pressures:
      key: microbial_oil_precedent
      note: "Reuses the same 4-effect pressure profile as systems._microbial_oil_system's fermentation-broth multi-effect evaporator, which has no independent literature grounding of its own either -- kept only for consistency of MultiEffectEvaporator staging across sabre systems."


fermentation:
  product_ID: HP
  cellmass_ID: CellMass
  lime_ID: CalciumDihydroxide
  product_salt_ID: Ca3HP2

  # Substrate -> HP conversion (X) and the mass-yield coefficient applied to
  # the resulting consumed mass (kg HP formed per kg substrate consumed by
  # *this* reaction only). Each substrate also has an independent, much
  # smaller cell-mass-forming conversion (see biomass_conversion /
  # biomass_yield_kg_per_kg_consumed below) drawn from the same original
  # available pool.
  #
  # Glucose -> 2 HP is exactly mass-balanced (2 * HP's MW == Glucose's MW,
  # both 180.15588), so its hp_yield_kg_per_kg_consumed is exactly 1.0.
  # Mannitol and AlginateMonomer are NOT exact multiples of HP's MW, and
  # thermosteam.Reaction does not enforce or warn on an unbalanced
  # reaction -- confirmed by direct testing that running an unbalanced
  # Reaction (e.g. "Mannitol -> 2 HP") silently destroys real mass. To
  # avoid that, HPFermentation computes these two substrates' HP
  # formation imperatively (consumed * mass yield, mirroring sabre's own
  # YarrowiaLipidFermenter._run_reactions pattern) using the MW-derived
  # mass yield below.
  substrates:
    Glucose:
      hp_conversion: 0.49
      hp_yield_kg_per_kg_consumed: 1.0
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.8270910524818841
    Mannitol:
      hp_conversion: 0.40
      hp_yield_kg_per_kg_consumed: 0.9889341794798491
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.8179386113412968
    AlginateMonomer:
      hp_conversion: 0.40
      hp_yield_kg_per_kg_consumed: 0.9279717563771187
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.7675171366554135

  # Batch time tau = simulated titer / productivity [hr], computed by
  # HPFermentation itself in _run from the actual HP formed per broth volume
  # (a self-contained simplification of HP's external.
  # There is deliberately no titer parameter here: the
  # earlier 62.5 g/L value only ever set tau and did not match the ~83 g/L
  # HP-equivalent the simulated broth actually reaches, so tau ended up
  # inconsistent with the simulated concentration. The broth concentration
  # is set by fermentation_feed_evaporator.target_solids_wt_frac above.
  productivity_g_per_L_per_h: 0.76

  # In-situ neutralization with Ca(OH)2
  # Dosed based on the stoichiometric demand plus a small excess.
  neutralization_conversion: 0.999999999  # 1 - 1e-9, matches HP's own Rxn(..., 'HP', 1-1e-9)
  lime_excess_frac: 0.02

  T_K: 301.15  # 28 degC, matches HP's BatchCoFermentation operating temperature
  P_Pa: 101325.0
  V_m3: 3785.0  # matches HP's BatchCoFermentation default reactor volume

  sources:
    conversions_and_titer:
      key: user_specified
      note: "Assumptions; biorefineries.HP itself uses 0.49 for its own Glucose/Xylose -> HP conversions and 0.76 g/L/hr as its default BatchCoFermentation.productivity, confirming these are shared literature/flowsheet values, not novel to this feedstock."
    biomass_yield:
      key: analogous_to_HP
      note: "Analogous to HP's 'Glucose -> 6 FermMicrobe + 2.4 H2O' (X=0.05). Coefficient here (6 mol CellMass per mol substrate) is scaled to sabre's own CellMass MW (24.8342 g/mol); no independent literature source for Sargassum-derived substrates specifically."
    neutralization:
      key: HP_precedent
      note: "biorefineries.HP.units.BatchCoFermentation neutralizes lactic-acid-family products with Ca(OH)2 via Rxn('2 HP + CalciumDihydroxide -> CalciumLactate + 2 H2O', 'HP', 1-1e-9); reused here verbatim (X and reactant choice) but forming Ca3HP2 instead of CalciumLactate, and dosed to exact stoichiometric demand instead of HP's fixed lime_mol_per_L_loading, since this preliminary model has no other use for excess lime."
    reactor_T_V:
      key: HP_precedent
      note: "T=28 degC and V=3785 m3 (1,000,000 gal) match biorefineries.HP.units.BatchCoFermentation's own defaults; not re-derived for Sargassum substrates."


crystallization:
  product_ID: Ca3HP2

  # Fixed recovery fraction: the
  # patent reports fixed recovery/purity at specified conditions (room
  # temperature, ~300 rpm stirring).
  target_recovery: 0.91  # midpoint of the patent's reported ~90-92% range

  T_K: 298.15  # room temperature, per the patent's Examples 1/2
  tau: 4.0  # batch crystallization time [hr]; no source found for this value, scoping placeholder
  V_m3: 200.0

  sources:
    recovery:
      key: user_specified_patent
      note: "Patent Examples 1/2 and Table 1 report ~90-92% Ca(3HP)2 recovery at room temperature with ~300 rpm stirring; 91% (midpoint) selected as the fixed recovery fraction."
    reactor_sizing:
      key: scoping_placeholder
      note: "tau and V are current scoping assumptions for process modeling and should be sensitivity-tested; no literature source for full-scale batch crystallizer sizing on this system."


cell_mass_centrifuge:
  # bst.units.SolidsCentrifuge:
  # separates CellMass (formed as a small side product in HPFermentation)
  # from the clarified broth before the broth_evaporator/CaHPCrystallizer chain.
  cellmass_split_to_cake: 0.98  # fraction of CellMass captured to the solids-rich outlet; same basis as EnzymaticPress/Press's own solids_capture_frac
  moisture_content: 0.65  # scoping placeholder for a wet cell-mass cake; no source found for this value

  sources:
    moisture_content:
      key: scoping_placeholder
      note: "No literature source found for this feedstock/organism combination; 0.65 selected as a plausible wet-cake moisture content, consistent with typical centrifuge cell-mass cakes (~60-80 wt% moisture)."


crystal_separator:
  # Downstream bst.units.SolidsCentrifuge instantiation.
  moisture_content: 0.05  # crystal-cake moisture leaving the centrifuge

  sources:
    purity:
      key: user_specified_patent
      note: "Patent reports ~93-99% crystal purity after this separation step. Purity is NOT modeled here: the crystal separator's split moves only Ca3HP2 (and the moisture water) to the cake, so the simulated cake is essentially pure Ca3HP2 by construction (~99.95% after drying), regardless of moisture_content. moisture_content is just a plausible cake-moisture placeholder."


mother_liquor_recycle:
  # Fraction of the crystal separator's mother liquor recycled back into the
  # broth evaporator feed, ahead of the concentration target. The remainder is purged
  # as liquid waste.
  recycle_frac: 0.5

  sources:
    recycle_frac:
      key: scoping_placeholder
      note: "No literature source; 0.5 as a placeholder."


dryer:
  # Downstream bst.units.DrumDryer instantiation.
  target_moisture_content: 0.0005  # 500 ppm, mid-range of the patent's ~200-5000 ppm dried product

  sources:
    target_moisture:
      key: user_specified_patent
      note: "Patent's oven-drying step (Examples 1/2) reports final moisture in the ~200-5000 ppm range; 500 ppm selected as a representative mid-range target."
