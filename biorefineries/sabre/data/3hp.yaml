# Model Assumptions: 3-HP Fermentation and Crystallization

# Default cake solids of the press in systems/_3hp_system.py; a feedstock
# type's own `press` block (data/feedstock.yaml) overrides it.
press_cake_solids_wt_frac_override: 0.27  # see sources below

sources:
  press_cake_solids_wt_frac:
    key: preprocessing_yaml_own_citation
    note: >
      data/preprocessing.yaml's own press.sources.performance citation
      (Vincent Corporation seaweed pressing notes) says "Sargassum-specific
      pressing data indicate cake solids around 26-29 wt% TS; 27 wt% TS
      selected as central baseline". 0.27 is applied here as an override.


pressate_concentrator:
  # Retargets sabre.units.PressateConcentrator at the pressate's and hydrolysate's
  # fermentable sugars (Glucose, Mannitol, Uronics).
  enabled: true
  retained_solute_IDs: [Glucose, Mannitol, Uronics]
  water_recovery_to_permeate: 0.93  # same basis as biostimulant.yaml's own instance
  retained_solute_recovery_to_concentrate: 0.95  # same basis as biostimulant.yaml's own instance
  nontarget_solute_recovery_to_permeate: 0.70  # no reference; same placeholder as biostimulant.yaml
  design_flux_L_m2_h: 35.0  # same basis as biostimulant.yaml's own instance
  operating_pressure_bar: 5.0
  electricity_kWh_per_m3_feed: 2.5
  capex_usd_per_m2: 500.0
  maintenance_frac_of_capex_per_yr: 0.035
  F_BM: 1.0  # capex already installed

  sources:
    reused_from_biostimulant:
      key: same_membrane_physics
      note: "Flux/electricity/capex/maintenance bases are the same UF membrane literature already cited in data/biostimulant.yaml's pressate_concentrator section (Sievers et al. 2017, Diaz-Reinoso and Dominguez 2020, Sethi and Wiesner 2000, Nguyen and Yoshikawa 2020, Cheryan 1998)."


fermentation_feed_evaporator:
  target_solids_wt_frac: 0.20
  boiling_temperature_K: 333.15  # mild vacuum evaporation ~60 C; same basis as biostimulant.yaml
  condensing_temperature_K: 310.15  # ~37 C; same basis as biostimulant.yaml
  nonwater_recovery_to_product: 1.0  # not 0.995 like biostimulant.yaml's own instance
  tau: 0.25  # hr; nominal vessel holdup time; no literature/prior-yaml grounding
  vacuum_system_preference: "Liquid-ring pump"

  sources:
    target_concentration:
      key: HP_precedent
      note: "biorefineries.HP.units.EnzymeHydrolysateMixer targets solid_loading=0.20 for its own pre-fermentation hydrolysate; reused here as the 'concentration match' requested for this pathway's fermentation feed."
    nonwater_recovery:
      key: bugfix
      note: "1.0 (not biostimulant.yaml's 0.995) so raw_vapor carries pure Water only."


broth_evaporator:
  # bst.units.MultiEffectEvaporator instantiation, concentrating the cell-mass-free fermentation broth to the
  # patent's crystallization threshold before CaHPCrystallizer.
  target_product_concentration_g_per_L: 450.0  # midpoint of the patent's 300-600 g/L crystallization threshold, solubility noted as 450 g/L in the patent
  P_Pa: [101325, 69682, 47057, 30953]  # same 4-effect pressure profile as systems._microbial_oil_system's fermentation-broth multi-effect evaporator
  V: 0.90  # initial guess; overridden by the bisection specification at simulation time

  sources:
    target_concentration:
      key: user_specified_patent
      note: "Patent reports 300-600 g/L as the crystallization-feed 3-HP(salt) concentration range; 450 g/L (midpoint) selected as the target."
    effect_pressures:
      key: microbial_oil_precedent
      note: "Reuses the same 4-effect pressure profile as systems._microbial_oil_system's fermentation-broth multi-effect evaporator, which has no independent literature grounding of its own either -- kept only for consistency of MultiEffectEvaporator staging across sabre systems."


fermentation:
  product_ID: HP
  cellmass_ID: CellMass
  lime_ID: CalciumDihydroxide
  product_salt_ID: Ca3HP2

  # Substrate -> HP conversion (X) and the mass-yield coefficient applied to
  # the resulting consumed mass (kg HP formed per kg substrate consumed by
  # *this* reaction only). Each substrate also has an independent, much
  # smaller cell-mass-forming conversion (see biomass_conversion /
  # biomass_yield_kg_per_kg_consumed below) drawn from the same original
  # available pool.
  #
  # Glucose -> 2 HP is exactly mass-balanced (2 * HP's MW == Glucose's MW,
  # both 180.15588), so its hp_yield_kg_per_kg_consumed is exactly 1.0.
  # Mannitol and Uronics are NOT exact multiples of HP's MW, and
  # thermosteam.Reaction does not enforce or warn on an unbalanced
  # reaction -- confirmed by direct testing that running an unbalanced
  # Reaction (e.g. "Mannitol -> 2 HP") silently destroys real mass. To
  # avoid that, HPFermentation computes these two substrates' HP
  # formation imperatively (consumed * mass yield, mirroring sabre's own
  # YarrowiaLipidFermenter._run_reactions pattern) using the MW-derived
  # mass yield below.
  substrates:
    Glucose:
      # hp_conversion updated 2026-10-03 from the generic HP-pathway default
      # (0.49) to a value informed by Tan et al. 2026 (Nat. Commun. 17:899,
      # "High yield production of 3-hydroxypropionic acid using
      # Issatchenkia orientalis", DOI 10.1038/s41467-025-67621-8) -- see
      # glucose_conversion source below. biomass_conversion/
      # biomass_yield_kg_per_kg_consumed are NOT from that paper (it
      # doesn't separately report a cell-mass yield for this strain) and
      # are left at their prior placeholder values.
      hp_conversion: 0.665
      hp_yield_kg_per_kg_consumed: 1.0
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.8270910524818841
    Mannitol:
      hp_conversion: 0.40
      hp_yield_kg_per_kg_consumed: 0.9889341794798491
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.8179386113412968
    Uronics:
      hp_conversion: 0.40
      hp_yield_kg_per_kg_consumed: 0.9279717563771187
      biomass_conversion: 0.05
      biomass_yield_kg_per_kg_consumed: 0.7675171366554135

  # Batch time tau = simulated titer / productivity [hr], computed by
  # HPFermentation itself in _run from the actual HP formed per broth volume
  # (a self-contained simplification of HP's external.
  # There is deliberately no titer parameter here: the
  # earlier 62.5 g/L value only ever set tau and did not match the ~83 g/L
  # HP-equivalent the simulated broth actually reaches, so tau ended up
  # inconsistent with the simulated concentration. The broth concentration
  # is set by fermentation_feed_evaporator.target_solids_wt_frac above.
  productivity_g_per_L_per_h: 0.76

  # In-situ neutralization with Ca(OH)2
  # Dosed based on the stoichiometric demand plus a small excess.
  neutralization_conversion: 0.999999999  # 1 - 1e-9, matches HP's own Rxn(..., 'HP', 1-1e-9)
  lime_excess_frac: 0.02

  T_K: 301.15  # 28 degC, matches HP's BatchCoFermentation operating temperature
  P_Pa: 101325.0
  V_m3: 3785.0  # matches HP's BatchCoFermentation default reactor volume

  sources:
    conversions_and_titer:
      key: user_specified
      note: "Mannitol/Uronics hp_conversion (0.40) and productivity_g_per_L_per_h (0.76) are still the generic HP-pathway defaults biorefineries.HP itself uses for its own Glucose/Xylose -> HP conversions, not derived from literature for Sargassum-derived substrates or this organism specifically -- see glucose_conversion below for the one substrate that HAS been updated."
    glucose_conversion:
      key: Tan_2026_Issatchenkia_orientalis
      note: >
        Glucose hp_conversion updated 2026-10-03 to 0.665, derived from Tan
        et al. 2026 (Nat. Commun. 17:899, "High yield production of
        3-hydroxypropionic acid using Issatchenkia orientalis", DOI
        10.1038/s41467-025-67621-8), who report a fed-batch strain
        (engineered I. orientalis, beta-alanine pathway) achieving 92 g/L
        titer, 0.70 g 3HP/g glucose CONSUMED, and 0.55 g/L/h productivity on
        dextrose/corn-steep-liquor medium (DASbox fed-batch, pH 4, DO 5%).
        0.70 g/g is ~71% of the pathway's own GSM-computed theoretical max
        (0.986 g 3HP/g glucose) -- sabre's existing
        hp_yield_kg_per_kg_consumed=1.0 already approximates that
        theoretical ceiling via exact mass-balance stoichiometry, so it was
        left unchanged. What actually needed correcting was hp_conversion:
        it previously left ~47% of available Glucose completely
        unconverted (0.49 conversion + 0.05 to biomass), unlike the paper's
        fed-batch process, which is pulse-fed to near-complete glucose
        consumption each cycle. 0.665 = 0.70 (yield on consumed) x 0.95
        (assumed near-complete consumption fraction, informed by the
        paper's own pulse-feed-to-near-zero-residual-glucose protocol, not
        separately reported as a single number in the paper). Verified by
        simulation to raise Ca3HP2 output ~18% and lower the baseline MSP
        ~14% (the higher consumption fraction outweighs the lower
        per-consumed yield). Caveats: (1) measured on dextrose/CSL medium,
        not on Sargassum-derived sugars, so transferability to this
        feedstock's actual hydrolysate (mixed Glucose/Mannitol/
        Uronics, residual ash/salts) is unverified; (2) the 95%
        consumption fraction is this model's own assumption, not read
        directly off the paper; (3) titer (92 g/L) and productivity
        (0.55 g/L/h) from the same paper were NOT incorporated here --
        titer is not a sabre fermentation input (it's an evaporator-target
        output) and productivity's effect on MSP was separately verified
        to be small (<1%).
    biomass_yield:
      key: analogous_to_HP
      note: "Analogous to HP's 'Glucose -> 6 FermMicrobe + 2.4 H2O' (X=0.05). Coefficient here (6 mol CellMass per mol substrate) is scaled to sabre's own CellMass MW (24.8342 g/mol); no independent literature source for Sargassum-derived substrates specifically."
    neutralization:
      key: HP_precedent
      note: "biorefineries.HP.units.BatchCoFermentation neutralizes lactic-acid-family products with Ca(OH)2 via Rxn('2 HP + CalciumDihydroxide -> CalciumLactate + 2 H2O', 'HP', 1-1e-9); reused here verbatim (X and reactant choice) but forming Ca3HP2 instead of CalciumLactate, and dosed to exact stoichiometric demand instead of HP's fixed lime_mol_per_L_loading, since this preliminary model has no other use for excess lime."
    reactor_T_V:
      key: HP_precedent
      note: "T=28 degC and V=3785 m3 (1,000,000 gal) match biorefineries.HP.units.BatchCoFermentation's own defaults; not re-derived for Sargassum substrates."


crystallization:
  product_ID: Ca3HP2

  # Fixed recovery fraction: the
  # patent reports fixed recovery/purity at specified conditions (room
  # temperature, ~300 rpm stirring).
  target_recovery: 0.91  # midpoint of the patent's reported ~90-92% range

  T_K: 298.15  # room temperature, per the patent's Examples 1/2
  tau: 4.0  # batch crystallization time [hr]; no source found for this value, scoping placeholder
  V_m3: 200.0

  sources:
    recovery:
      key: user_specified_patent
      note: "Patent Examples 1/2 and Table 1 report ~90-92% Ca(3HP)2 recovery at room temperature with ~300 rpm stirring; 91% (midpoint) selected as the fixed recovery fraction."
    reactor_sizing:
      key: scoping_placeholder
      note: "tau and V are current scoping assumptions for process modeling and should be sensitivity-tested; no literature source for full-scale batch crystallizer sizing on this system."


cell_mass_centrifuge:
  # bst.units.SolidsCentrifuge:
  # separates CellMass (formed as a small side product in HPFermentation)
  # from the clarified broth before the broth_evaporator/CaHPCrystallizer chain.
  cellmass_split_to_cake: 0.98  # fraction of CellMass captured to the solids-rich outlet; same basis as Press's own solids_capture_frac
  moisture_content: 0.65  # scoping placeholder for a wet cell-mass cake; no source found for this value

  sources:
    moisture_content:
      key: scoping_placeholder
      note: "No literature source found for this feedstock/organism combination; 0.65 selected as a plausible wet-cake moisture content, consistent with typical centrifuge cell-mass cakes (~60-80 wt% moisture)."


crystal_separator:
  # sabre.units.CrystalCentrifuge instantiation. The wet cake carries mother
  # liquor (impurities included) at this water content, so product purity
  # follows from moisture_content and the mother-liquor composition.
  moisture_content: 0.05  # crystal-cake moisture (water mass fraction) leaving the centrifuge

  sources:
    purity:
      key: user_specified_patent
      note: "Patent reports ~93-99% crystal purity after this separation step. Purity is modeled through liquor entrainment in the cake (sugars, enzyme, ash, etc. dissolved in the mother liquor dry onto the crystals); it is not an input. Higher moisture_content -> lower purity. 0.05 is a plausible cake-moisture placeholder with no literature source; a cake wash would raise purity and is not modeled."


mother_liquor_recycle:
  # Fraction of the crystal separator's mother liquor recycled back into the
  # broth evaporator feed, ahead of the concentration target. The remainder is purged
  # as liquid waste.
  recycle_frac: 0.5

  sources:
    recycle_frac:
      key: scoping_placeholder
      note: "No literature source; 0.5 as a placeholder."


dryer:
  # Downstream bst.units.DrumDryer instantiation.
  target_moisture_content: 0.0005  # 500 ppm, mid-range of the patent's ~200-5000 ppm dried product

  sources:
    target_moisture:
      key: user_specified_patent
      note: "Patent's oven-drying step (Examples 1/2) reports final moisture in the ~200-5000 ppm range; 500 ppm selected as a representative mid-range target."


hydrolysate_separator:
  # bst.PressureFilter after saccharification, as cellulosic's cornstover
  # train does. Residual solids go to the boiler; the filtrate is the
  # hydrolysate.
  moisture_content: 0.35  # BioSTEAM PressureFilter default (Humbird et al. 2011)
  solids_split_to_cake: 0.98  # Humbird's insoluble-solids retention (PressureFilter defaults)
  solutes_split_to_cake: 0.03714  # Humbird's dissolved-species carryover in the cake moisture

  sources:
    filter:
      key: cellulosic_precedent
      note: "Values are biosteam.PressureFilter's own defaults, taken from Humbird et al. (2011) NREL/TP-5100-47764."


# ---------------------------------------------------------------------------
# "juice_pulp" configuration (systems/_3hp_system.py): mill -> screw press ->
# juice concentration; press pulp -> enzymatic hydrolysis tank -> filter;
# juice concentrate and pulp hydrolysate are combined as one fermentation feed.
# ---------------------------------------------------------------------------
pulp_enzymatic_hydrolysis:
  # Scenario scripts set the conversion on the hydrolysis tank (SA) and the
  # enzyme loading on the enzyme mixer (M_SA).
  # Fraction of Glucan and of Alginate hydrolyzed directly to Glucose / Uronics.
  hydrolysis_conversion: 0.80
  # Total enzyme per g dry biomass fed to the press (the ASPECT milestone cap).
  enzyme_loading_mg_per_g_dwb: 25.0
  solids_loading: 0.20  # insoluble-solids wt frac in the hydrolysis tank; water added only if the pulp is more concentrated
  T_K: 321.15  # 48 degC, same as cellulosic's saccharification
  V_max_m3: 3785.4  # largest single tank (1,000,000 gal), as biorefineries.cellulosic.Saccharification
  tau_hr: 96.0  # hydrolysis time in the proposal's milestone text; PLACEHOLDER for vessel sizing

  sources:
    hydrolysis_conversion:
      key: proposal_milestones
      note: "80% monomer release, the BP3/GNG2/BP5 target; a target, not a measured value for this feedstock and enzyme."
    enzyme_loading:
      key: proposal_milestones
      note: "25 mg enzyme/g dry weight biomass, the milestone cap, as the total dose; the stream is priced at data/tea.yaml price.enzyme."
    tank_costing:
      key: cellulosic_HP_precedent
      note: "SA is sabre.units.HydrolysisTank, costed like biorefineries.cellulosic ContinuousPresaccharification and biorefineries.HP Saccharification (Humbird et al. 2011): volume-scaled tanks (exponent 0.7) up to V_max each, instead of 30 m3 stirred MixTanks. Both references use 24 h residence; 96 h here is the proposal's figure, so the tank volume is extrapolated well beyond the Humbird size."
    tau:
      key: proposal_milestones
      note: "96 h is the hydrolysis time in the ASPECT milestone table / project prompt; no feedstock-specific kinetics are modeled, only a fixed conversion, so the tank is sized for this residence time."
    solids_loading:
      key: HP_precedent
      note: "biorefineries.HP.units.EnzymeHydrolysateMixer's solid_loading (0.20)."

# ---------------------------------------------------------------------------
# `baseline` scenario (systems/_3hp_system.py): the press pulp is
# pretreated (mild thermochemical: 1% H2SO4, 1 M NaCl, 121 degC, 20 min) and neutralized before the enzymatic hydrolysis,
# with the reactor train structured like biorefineries.cellulosic's corn stover train
# (systems/pretreatment/dilute_acid.py) with sabre-local units. The
# `pretreatment_press` scenario skips this step.
# ---------------------------------------------------------------------------
mild_pretreatment:
  # Sulfuric acid dosing. The acid stream is a ~93.3 wt% H2SO4 solution
  # (1800 kg H2SO4 : 130 kg water, biorefineries.cellulosic.streams), and the
  # loading is on a SOLUTION-mass basis per kg of dry feed, as in
  # cellulosic's SulfuricAcidTank specification.
  acid_solution_H2SO4_kg: 1800.0
  acid_solution_water_kg: 130.0
  acid_solution_loading_kg_per_kg_dry: 0.0432  # H2SO4 = 1 wt% of the slurry liquid (calibrated, see sources.mild_thermochemical)
  nacl_kg_per_kg_dry: 0.2405  # NaCl = 1 M (58.4 g/L) in the slurry liquid (calibrated, see sources.mild_thermochemical)
  warm_water_kg_per_kg_dry: 0.282  # dilution water mixed with the acid before the steam mixer

  # Steam mixer + pressure reactor: the mild thermochemical pretreatment
  # (1% H2SO4, 1 M NaCl, 121 degC, 20 min) of Chundawat (Rutgers).
  reactor_T_K: 394.15  # 121 degC
  reactor_P_atm: 2.1  # just above the saturation pressure of water at 121 degC (2.05 atm)
  solids_loading: 0.30  # SteamMixer target solids wt frac (process water added only if the cake is above this)
  reactor_tau_hr: 0.3333  # 20 min
  reactor_V_wf: 0.8
  reactor_length_to_diameter: 2.0
  reactor_vessel_material: "Stainless steel 316"
  reactor_vessel_type: "Horizontal"
  warm_water_T_K: 368.15
  warm_water_P_atm: 4.7

  # Conversions applied in the reactor. Glucan value is corn stover's own
  # (PretreatmentReactorSystem's Glucan + H2O -> Glucose, X=0.099).
  glucan_to_glucose_conversion: 0.099
  alginate_to_uronics_conversion: 0.099  # PLACEHOLDER: reuses the Glucan value

  flash_P_Pa: 101325.0
  ammonia_mol_per_mol_H2SO4: 2.0  # 2 NH3 + H2SO4 -> (NH4)2SO4, full neutralization

  sources:
    mild_thermochemical:
      key: chundawat_technical_narrative
      note: "The baseline pretreatment is the mild thermochemical pretreatment of S. Chundawat (Rutgers), as in the Team Technical Narrative: 1% H2SO4, 1 M NaCl, 121 degC, 20 min (measured on dilute biomass; the narrative gives no loading for the pretreatment itself, so this model keeps its 30 wt% target solids). The acid and NaCl doses are calibrated on the simulated slurry: 4.03 kg liquid water per kg dry pulp after the steam mixer (cake 24.3 wt% solids, 22.3 wt% after steam), so 1 wt% H2SO4 of the liquid = 0.0403 kg H2SO4 = 0.0432 kg of the 93.3 wt% solution per kg dry pulp, and 1 M NaCl (about 0.0597 kg per kg of liquid water) = 0.2405 kg NaCl per kg dry pulp. Recalibrate them if the cake, warm water or steam change. NaCl is bought fresh (data/tea.yaml price.sodium_chloride, $0.08/kg; data/lca.yaml sodium_chloride, 0.043 kg CO2e/kg) with no recycle; 316 stainless steel is kept for the reactor although 1 M chloride at 121 degC may need a more resistant alloy (not costed)."
    reactor_other:
      key: cellulosic_corn_stover_precedent
      note: "warm_water_kg_per_kg_dry, reactor_V_wf, solids_loading, warm_water_T_K/P_atm and the Glucan and Alginate conversions are still the corn stover values (158 degC dilute-acid) of biorefineries/cellulosic/systems/pretreatment/dilute_acid.py and cellulosic/units.py (PretreatmentReactorSystem). The conversions are kept so the baseline and pretreatment_press scenarios stay comparable; they are not measured for the mild conditions."
    ash_buffering_caveat:
      key: known_model_limitation
      note: "Sargassum is ~35 wt% dry ash (modeled as inert CaO), which in reality buffers the acid, and alginate gels at low pH. The 1 wt% H2SO4 dose (of the liquid) does NOT account for either, so acid and neutralizer costs are likely understated. Placeholder pending Sargassum-specific data on the mild thermochemical pretreatment."
    alginate_conversion:
      key: placeholder
      note: "No source for alginate conversion under dilute acid; set equal to the Glucan value. No degradation products (HMF, furfural) are modeled since they are not in sabre's chemical set."
    ammonia_dilution_water:
      key: simplification
      note: "Corn stover also adds 2435.6 kg process water per kmol NH4OH; omitted here (the hydrolysate is diluted or concentrated to spec downstream anyway)."


# ---------------------------------------------------------------------------
# `pretreatment_press` scenario: no pretreatment reactor; the same H2SO4 and NaCl
# as the baseline, per kg of dry pulp, are dosed onto the pressed pulp at the end
# of the screw press (after nearly all the press water is gone), and the pulp is
# assumed to reach the baseline's hydrolysis. The acid is neutralized with
# ammonia in the enzymatic hydrolysis step. The juice carries none of them.
# ---------------------------------------------------------------------------
pretreatment_press:
  # No parameters of its own: the doses (acid_solution_loading_kg_per_kg_dry,
  # nacl_kg_per_kg_dry), the acid solution composition, the Glucan/Alginate
  # conversions and the ammonia ratio are the baseline's (`mild_pretreatment` above).

  sources:
    pretreatment_dose:
      key: user_specified
      note: "Same H2SO4 and NaCl use as the baseline per kg of dry pulp (0.0432 kg of the ~93.3 wt% acid solution and 0.2405 kg NaCl), as if added toward the end of the screw press so that nearly all the water is already removed (user-specified). NaCl is bought fresh with no recycle. The doses are therefore more concentrated in the pulp liquid than in the baseline slurry, which also has steam condensate and dilution water. No heating, dilution water or hold time is modeled in the press."
    hydrolysis_in_press:
      key: user_specified
      note: "The pulp dosed at the end of the press is assumed to give the same hydrolysis as the baseline mild thermochemical pretreatment (Glucan and Alginate conversions of mild_pretreatment), applied in the dosing mixer, with no heating."
    press_split:
      key: simplification
      note: "The press itself is the plain measured press split (no chemicals ahead of it). Acid-resistant press materials are not costed."
    enzyme:
      key: simplification
      note: "Enzyme is dosed only in the hydrolysis step (25 mg/g dry biomass, as in the baseline): an enzyme in the acidic press would not be active. An earlier design that put enzyme and a NaCl brine in the press was dropped."
