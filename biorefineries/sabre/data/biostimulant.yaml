# Model Assumptions: Biostimulant Prouduction

pressate_concentrator:
  enabled: true
  retained_solute_IDs: [Alginate, Fucoidan, Mannitol, Protein, OtherSolids]
  water_recovery_to_permeate: 0.93
  retained_solute_recovery_to_concentrate: 0.95
  nontarget_solute_recovery_to_permeate: 0.70 # no reference
  design_flux_L_m2_h: 35.0
  operating_pressure_bar: 5.0
  electricity_kWh_per_m3_feed: 2.5
  capex_usd_per_m2: 500.0
  maintenance_frac_of_capex_per_yr: 0.035
  F_BM: 1.0 # capex already installed

  sources:
    flux:
      citation: "Seaweed/algal membrane concentration literature; Sievers et al. (2017); Díaz-Reinoso and Domínguez (2020)"
      note: "UF fluxes for bioprocess and seaweed-derived streams commonly fall in the ~15–60 LMH range; 35 LMH selected as a central design value."
    electricity:
      citation: "Membrane concentration literature for algal and bioprocess streams"
      note: "UF electricity commonly falls in the ~0.5–2.5 kWh/m3 range"
    nontarget_solute_recovery:
      note: "No literature or prior-yaml grounding."
    capex:
      citation: "Sethi and Wiesner (2000); Nguyen and Yoshikawa (2020); Cheryan (1998)"
      note: "UF membrane/module cost commonly reported around $200–$500/m2; $800/m2 for convervative assumption"
    maintenance:
      citation: "Assumed maintenance fraction consistent with other membrane systems in this model"
      note: "Annual maintenance retained at 3.5% of installed CAPEX for consistency."

biostimulant_evaporator:
  target_solids_wt_frac: null # originally set to 0.20, but this unit was not included in the system
  boiling_temperature_K: 333.15 # mild vacuum evaporation ~60 C
  condensing_temperature_K: 310.15 # ~37 C; auxiliary condenser cools the vapor to this before it
    # leaves as a liquid (e.g. to a wastewater mixer), rather than exiting as vapor.
  nonwater_recovery_to_product: 0.995
  tau: 0.25 # hr; nominal vessel holdup time, used only to size vacuum_system's
    # air-inleakage estimate. No literature/prior-yaml grounding.
  vacuum_system_preference: "Liquid-ring pump" # bst.Flash's own default;
    # "Steam-jet ejector" gives an implausibly large steam duty at this
    # unit's scale (correlation extrapolating outside its valid range).

  # NOTE: capex_ref_usd/ref_evaporation_kgph/scale_exponent (a flat $750,000
  # @ 10,000 kg/h evaporation, ^0.60 scaling) were removed -- no literature or
  # prior-yaml grounding for those numbers (confirmed against the pre-migration
  # BioSTEAM-platform/sabre_ad/sabre/units/biostimulant_evaporator.py, where
  # they were hardcoded __init__ defaults with no citation either). Capex now
  # comes entirely from BiostimulantEvaporator's evaporation_hx, condenser,
  # and vacuum_system auxiliaries' own BioSTEAM-computed installed costs.

  sources:
    condensing_temperature:
      note: "No literature grounding; picked as a plausible cooled-liquid outlet
        temperature above ambient, consistent with a typical process-side
        approach to cooling water."