# Model Assumptions: Feedstocks

# Dry-basis composition (mass fractions of dry solids, sums to 1). This is
# a structural baseline independent of any one feedstock type's moisture --
# per-feedstock-type moisture and ash targets below scale/override it (see
# make_sargassum_feed() in utils.py).
dry_composition:
  Ash: 0.3453          # 34.53% dry
  OtherSolids: 0.2941  # 29.41% dry
  Glucan: 0.1100       # 11.00% dry
  Alginate: 0.1050     # 10.50% dry
  Protein: 0.0756      # 7.56% dry
  Mannitol: 0.0200     # 2.00% dry
  Fucoidan: 0.0500     # 5.00% dry

feedstock_type:
  pelagic:
    moisture_frac: 0.8673
    ash_wt_frac_dry: 0.3453
    vs_ts: 0.6550
    source:
      key: milledge2020
      note: "Energies 2020 paper (Turks and Caicos pelagic species averages), Table 1."

  beach_wrack:
    moisture_frac: 0.8198
    ash_wt_frac_dry: 0.4694
    vs_ts: 0.5311
    source:
      key: milledge2020
      note: "Energies 2020 paper (Mixed Sargassum inundation), Table 1."

  natansVII:
    moisture_frac: 0.8673   # ASSUMED: reused from `pelagic` pending a literature source
    ash_wt_frac_dry: 0.2903 # balances dry_composition below to sum to 1
    vs_ts: 0.7097           # = 1 - ash_wt_frac_dry (not independently sourced)
    # Full per-type composition override -- NOT proportionally rescaled from
    # the global dry_composition above. Mannitol/Glucan/Alginate move by
    # different factors relative to the baseline (Mannitol up ~6.5x, Glucan
    # down ~0.64x, Alginate down ~0.86x), so a single ash-driven rescale
    # factor can't produce these targets; make_sargassum_feed() uses this
    # block directly when present instead (see utils.py).
    dry_composition:
      Ash: 0.2903
      OtherSolids: 0.2941  # unchanged from baseline
      Glucan: 0.0700       # 7.00% dry (user-specified)
      Alginate: 0.0900     # 9.00% dry (user-specified)
      Protein: 0.0756      # unchanged from baseline
      Mannitol: 0.1300     # 13.00% dry (user-specified)
      Fucoidan: 0.0500     # unchanged from baseline
    source:
      key: user_specified
      note: >
        Mannitol/Glucan/Alginate targets specified directly; Ash reduced to
        balance dry_composition to sum to 1; OtherSolids/Protein/Fucoidan
        held at the global baseline; moisture_frac assumed equal to pelagic
        pending a literature source.

policies:
  solids_loading_target_ts_wt_frac: 0.15
  solids_loading_target_ts_wt_frac_max: 0.20
  freshwater_wash_allowed: false
  retain_salinity: true

scale:
  wet_feed_ton_per_day: 15000
  ton_definition: metric