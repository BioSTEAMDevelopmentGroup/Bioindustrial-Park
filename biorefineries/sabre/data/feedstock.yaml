# Model Assumptions: Feedstocks

# Dry-basis composition (mass fractions of dry solids, sums to 1). This is
# a structural baseline independent of any one feedstock type's moisture --
# per-feedstock-type moisture and ash targets below scale/override it (see
# make_sargassum_feed() in utils.py).
dry_composition:
  Ash: 0.3453          # 34.53% dry
  OtherSolids: 0.2941  # 29.41% dry
  Glucan: 0.1100       # 11.00% dry
  Alginate: 0.1050     # 10.50% dry
  Protein: 0.0756      # 7.56% dry
  Mannitol: 0.0200     # 2.00% dry
  Fucoidan: 0.0500     # 5.00% dry

feedstock_type:
  pelagic:
    moisture_frac: 0.8673
    ash_wt_frac_dry: 0.3453
    vs_ts: 0.6550
    source:
      key: milledge2020
      note: "Energies 2020 paper (Turks and Caicos pelagic species averages), Table 1."

  beach_wrack:
    moisture_frac: 0.8198
    ash_wt_frac_dry: 0.4694
    vs_ts: 0.5311
    source:
      key: milledge2020
      note: "Energies 2020 paper (Mixed Sargassum inundation), Table 1."

  natansVII:
    moisture_frac: 0.8673   # ASSUMED: reused from `pelagic` pending a literature source
    ash_wt_frac_dry: 0.2903 # balances dry_composition below to sum to 1
    vs_ts: 0.7097           # = 1 - ash_wt_frac_dry (not independently sourced)
    # Full per-type composition override -- NOT proportionally rescaled from
    # the global dry_composition above. Mannitol/Glucan/Alginate move by
    # different factors relative to the baseline (Mannitol up ~6.5x, Glucan
    # down ~0.64x, Alginate down ~0.86x), so a single ash-driven rescale
    # factor can't produce these targets; make_sargassum_feed() uses this
    # block directly when present instead (see utils.py).
    dry_composition:
      Ash: 0.2903
      OtherSolids: 0.2941  # unchanged from baseline
      Glucan: 0.0700       # 7.00% dry (user-specified)
      Alginate: 0.0900     # 9.00% dry (user-specified)
      Protein: 0.0756      # unchanged from baseline
      Mannitol: 0.1300     # 13.00% dry (user-specified)
      Fucoidan: 0.0500     # unchanged from baseline
    source:
      key: user_specified
      note: >
        Mannitol/Glucan/Alginate targets specified directly; Ash reduced to
        balance dry_composition to sum to 1; OtherSolids/Protein/Fucoidan
        held at the global baseline; moisture_frac assumed equal to pelagic
        pending a literature source.

  wiatrowski2026:
    moisture_frac: 0.857    # harvested solids content 14.3%
    ash_wt_frac_dry: 0.361
    vs_ts: 0.639            # = 1 - ash_wt_frac_dry (not independently sourced)
    # Fresh (frozen) Sargassum from Puerto Rico, Wiatrowski et al. 2026, Table 1
    # and Tables S-5/S-6, converted from monomer to polymer basis:
    #   Glucan    = glucose 6.31% x 162.14/180.16                = 5.68%
    #   Alginate  = uronic acids 15.74% x 176.12/194.14          = 14.28%
    #   Fucoidan  = fucose 2.52% x 146.14/164.16                 = 2.24%
    #   Mannitol  = 5.38%;  Protein = 6.18% (N x 4.92);  Ash = 36.1%
    # OtherSolids is the balance (30.1%): the ~25% of dry mass the paper leaves
    # unassigned (polyphenolic residue), plus galactose/mannose/xylose (1.9%),
    # fatty acids as FAME (1.0%) and the water of hydrolysis. Modeled as lignin
    # in the 3-HP chemical set.
    dry_composition:
      Ash: 0.3610
      OtherSolids: 0.3014
      Glucan: 0.0568
      Alginate: 0.1428
      Protein: 0.0618
      Mannitol: 0.0538
      Fucoidan: 0.0224
    # Screw press at 15 psi, same paper (Tables 1, 2, S-5, S-6): the pressed
    # solids are 23.7 wt% solids and have the composition below (dry basis,
    # converted to polymer basis as above: ash 32.07, protein 5.71, glucose 7.13,
    # uronics 17.74, fucose 2.89, mannitol 2.51; OtherSolids is the balance).
    # `cake_fraction` is the fraction of each fresh component that goes to the
    # cake = f x (cake wt% / fresh wt%), with f = 0.8704 the largest total-solids
    # capture at which no polymer exceeds 100%. (The measured cake mass gives
    # 0.81 but includes ice-flush water and the paper reports no significant
    # carbohydrate loss.) The remainder, mostly mannitol and ash, goes to the
    # pressate, which the paper reports as about 99% mannitol (9.3-9.8 g/L).
    press:
      cake_solids_wt_frac: 0.237
      cake_fraction:
        Ash: 0.773
        Protein: 0.804
        Glucan: 0.983
        Alginate: 0.981
        Fucoidan: 0.998
        Mannitol: 0.406
        OtherSolids: 1.0
    source:
      key: wiatrowski2026
      note: "Wiatrowski et al. 2026, 'Production of Advanced Products from Sargassum through Integrated Conversion' (preprint). Values taken from a text extraction of the PDF with a garbled Table 1, cross-checked against the sums in Tables S-5 and S-6; not verified against the original tables."

policies:
  solids_loading_target_ts_wt_frac: 0.15
  solids_loading_target_ts_wt_frac_max: 0.20
  freshwater_wash_allowed: false
  retain_salinity: true

scale:
  # NLR base case (Wiatrowski et al. 2026): 3.0 million wet tonnes/year, i.e.
  # 429,000 dry tonnes/year at 14.3% solids, 1,306 dry tonnes/day, = 9,133 wet
  # tonnes/day of processing capacity. Previously 15,000.
  wet_feed_ton_per_day: 9133
  ton_definition: metric