# Model Assumptions: Fermentation

vfa:
  case: yarrowia_vfa_base

  vfa_IDs:
    - AceticAcid
    - PropionicAcid
    - ButyricAcid
    - ValericAcid
    - HexanoicAcid

  sources:
    pathway_concept:
      key: frontiers_2021_vfa_to_microbial_oil
      note: "VFAs generated by anaerobic digestion can serve as substrate for microbial oil production; literature process concept includes a VFA-rich permeate and a retentate suitable for secondary AD."
    yarrowia_vfa_feasibility:
      key: fontanille_2012_yarrowia_vfa_lipids
      note: "Yarrowia lipolytica can assimilate VFAs and accumulate intracellular lipids."
    yarrowia_real_vfa_feed:
      key: pereira_2023_food_waste_vfa_yarrowia
      note: "Yarrowia lipolytica has been tested on food-waste-derived VFAs and can accumulate intracellular lipids on real VFA mixtures."
    pH_control:
      key: gao_2020_yarrowia_high_vfa_alkaline
      note: "Initial pH 8 was reported as optimal under high-VFA alkaline cultivation."
    modeling_note:
      key: thesis_scoping_model
      note: "Residence time, stoichiometric yields, split fractions, and some equipment-cost placeholders below are current scoping assumptions for process modeling and should be sensitivity-tested."
    heat_of_reaction:
      key: cooney_bioreactor_design_o2_heat_of_reaction
      note: "Aerobic heat release of ~110 kcal (460 kJ) per mol O2 consumed is a standard heuristic (Cooney's rule) for Q_O2_consumption. Same value and source used in biorefineries.cane's AeratedFermentation/AeratedCoFermentation and biorefineries.OHFA's AeratedCoFermentation. Not calculated from thermo Hf: sabre's yield-based (non-atom-balanced) VFA conversion leaves the reaction enthalpy inconsistent, unlike biorefineries.milk/gas_fermentation which use atom-balanced Reaction objects and can rely on the Hf-based calculation. See https://www.academia.edu/19636928/Bioreactor_Design_for_Chemical_Engineers"

  cases:
    yarrowia_vfa_base:
      organism: Yarrowia lipolytica
      product_ID: MicrobialOil

      target_pH: 8.0

      tau: 48.0  # residence time [hr]; bst.AeratedBioreactor's own attribute name
      conversion: 0.85
      product_yield_kg_per_kg_vfa_consumed: 0.144
      biomass_yield_kg_per_kg_vfa_consumed: 0.40
      co2_yield_kg_per_kg_vfa_consumed: 0.20
      oxygen_kg_per_kg_vfa_consumed: 0.80

      Q_O2_consumption: -460240.0  # [kJ/kmol O2]; see sources.heat_of_reaction

      seed_water_kgph: 0.0
      seed_cellmass_kgph: 0.0

      notes:
        - "Main fermentation product is crude microbial oil."
        - "Omega fatty acids and squalene are not modeled as primary fermenter products in the base case."
        - "Residence time, conversion, biomass yield, CO2 yield, and O2 demand are current scoping assumptions."
        - "Q_O2_consumption is a hardcoded literature heuristic (see sources.heat_of_reaction), not calculated from thermo Hf."


fermentation_medium_tank:
  target_pH: 8.0

  tau: 0.5  # residence time [hr]; bst.Tank's own attribute name
  mixing_kW_per_m3: 0.05

  ammonia_dose_kg_per_m3: 0.0
  phosphate_dose_kg_per_m3: 0.0
  base_dose_kg_per_m3: 0.0
  magnesium_sulfate_dose_kg_per_m3: 0.49  # matches sabre_ad legacy default (integrated_system.py); no source found for this value

  product_quality:
    crude_product_stream_ID: crude_microbial_oil
    report_as: crude_microbial_oil

    dha_wt_frac_in_oil: 0.0 # unused
    squalene_wt_frac_in_oil: 0.0 # unused

    notes:
      - "Base case reports crude microbial oil only."
      - "DHA and squalene can be added later as fractions of recovered oil in a higher-value variant."
