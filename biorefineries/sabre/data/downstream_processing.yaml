# Model Assumptions: Downstream Processing

vfa_microfilter:
  vfa_IDs:
    - AceticAcid
    - PropionicAcid
    - ButyricAcid
    - ValericAcid
    - HexanoicAcid

  vfa_to_permeate_frac: 0.98
  water_to_permeate_frac: 0.97
  solids_to_permeate_frac: 0.05
  dissolved_other_to_permeate_frac: 0.90

  SEC_kWh_per_m3_feed: 0.08

  # Area-based membrane costing
  design_flux_L_m2_h: 20.0
  membrane_cost_usd_per_m2: 200.0
  F_BM: 1.0 # capex already installed

  notes:
    - "Area basis uses A = Q_feed * 1000 / flux, where flux is in L/m2/h."
    - "20 LMH selected as a conservative design flux for low-pressure clarification."
    - "$200/m2 selected as an upper-end polymeric membrane cost proxy."


vfa_product_splitter:
  # Fraction of VFA mass (the vfa_microfilter.vfa_IDs set) recovered to the
  # pure_vfa product stream; the rest (unrecovered VFA + everything else --
  # water, residual dissolved solids, etc.) goes to the vfa_disposal stream.
  vfa_recovery_frac: 0.98


oil_extraction:
  product_ID: MicrobialOil
  cellmass_ID: CellMass

  target_oil_and_solids_content_g_per_L: 70.0  # matches sabre_ad legacy behavior (vfa_fermentation_tea.py fallback); no source found for this value

  oil_recovery: 0.99
  oil_water_split: 0.0001

  recycle_total_fraction: 0.10
  recycle_cellmass_wt_frac: 0.10

  ref_dry_biomass_tph: 10.0
  ref_installed_cost_usd: 7848000.0
  homogenization_kWh_per_kg_dry_biomass: 0.203
  scale_exponent: 0.6
  F_BM: 1.0 # capex already installed

  oil_extraction_reagent_usd_per_kg_oil: 0.50

  notes:
    - "Oil extraction placeholder carries disruption + wet extraction burden."
    - "Installed cost basis back-calculated from NREL 55431 cell-disruption plus extraction/separation cost bases."
    - "Homogenization electricity aligned to the harmonized NREL algal-lipid basis."
    - "No literature source cited in legacy scripts for reagent cost."