<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg: #1a1a1a; --leader: #6a6a6a; }
  html, body { margin: 0; background: #ffffff; color: var(--fg);
    font-family: Arial, "DejaVu Sans", sans-serif; }
  /* size to content so the rendered boundingBox spans the full grid (incl.
     the callout gutters); a plain block would stay viewport-wide and clip
     the last column on capture. */
  #figure { padding: 16px; width: max-content; }
  #grid { display: grid; gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .title { font-size: 13px; font-weight: bold; margin: 2px 0 0; }
  .cell .subtitle { font-size: 11px; color: #444; margin: 0 0 4px; }
  /* .plot wraps the 300x300 tessellation in left/right gutters that hold
     the leader-line callout labels for small cells. */
  .plot { position: relative; }
  .chart { position: absolute; top: 0; width: 300px; height: 300px; }
  .callouts { position: absolute; top: 0; left: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="figure">
  <div id="grid"></div>
</div>
<script src="./vendor/am5.bundle.js"></script>
<script>
/* eslint-disable */
(async function () {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const CHART = 300;      // tessellation square (px)
  const GUT = 96;         // callout gutter each side (px)
  const PLOTW = CHART + 2 * GUT;
  const LABEL_FS = 9;     // callout label font size
  const LH = 10;          // callout line height
  const CELL_FS = 10;     // in-cell label font size

  // Each tile is a single hue (its campaign color, from Stage 1); every
  // piece is a shade of that one hue. The five metabolic categories form a
  // dark->light ramp (glycolysis darkest -> isobutanol lightest, echoing
  // parameter-sets panel C); housekeeping, translation and slack each get
  // their own fixed lightness. t > 0 lightens toward white, t < 0 darkens
  // toward black; the metabolic ramp reuses panel C's linspace(0, 0.66, 5).
  const PIECE_SHADE = {
    housekeeping: -0.25,
    cat_glycolysis: 0.00,
    cat_tca: 0.165,
    cat_acetate: 0.33,
    cat_ethanol: 0.495,
    cat_isobutanol: 0.66,
    translation: 0.78,
    slack: 0.90,
  };
  function shade(hex, t) {
    const h = hex.replace("#", "");
    let r = parseInt(h.slice(0, 2), 16),
        g = parseInt(h.slice(2, 4), 16),
        b = parseInt(h.slice(4, 6), 16);
    if (t >= 0) {
      r += (255 - r) * t; g += (255 - g) * t; b += (255 - b) * t;
    } else {
      const k = 1 + t; r *= k; g *= k; b *= k;
    }
    return am5.color((Math.round(r) << 16) | (Math.round(g) << 8)
      | Math.round(b));
  }

  // Drop empty (value ~0) leaves before tessellation: a zero-value site
  // still claims a thin sliver cell in the Voronoi power diagram, so a pool
  // that is genuinely off (e.g. the baseline's Ehrlich isobutanol pools, or
  // zero slack on a derated tile) would otherwise show as a leaf. Parent
  // grouping nodes ("Metabolic") are kept and pruned recursively.
  function pruneZeros(nodes) {
    const out = [];
    for (const n of nodes) {
      if (n.children && n.children.length) {
        out.push(Object.assign({}, n, { children: pruneZeros(n.children) }));
      } else if (!(typeof n.value === "number" && n.value <= 1e-9)) {
        out.push(n);
      }
    }
    return out;
  }

  // text metrics (shared canvas) for the fit test and callout wrapping
  const _mctx = document.createElement("canvas").getContext("2d");
  function textWidth(s, fs) { _mctx.font = fs + "px Arial"; return _mctx.measureText(s).width; }

  // greedily wrap a name to <= maxW px at the callout font size
  function wrapLabel(name, maxW) {
    const words = name.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? cur + " " + w : w;
      if (textWidth(trial, LABEL_FS) <= maxW || !cur) {
        cur = trial;
      } else {
        lines.push(cur); cur = w;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Stack callout labels of one gutter so they don't overlap: seed each near
  // its cell's centroid y, then push down to clear the previous label, and if
  // the stack overruns the bottom, shift the whole column up.
  function stack(items, top, bottom, gap) {
    items.sort(function (a, b) { return a.cy - b.cy; });
    let y = top;
    for (const it of items) {
      it.top = Math.max(it.cy - it.h / 2, y);
      it.mid = it.top + it.h / 2;
      y = it.top + it.h + gap;
    }
    if (items.length) {
      const last = items[items.length - 1];
      const overflow = (last.top + last.h) - bottom;
      if (overflow > 0) {
        for (const it of items) { it.top -= overflow; it.mid -= overflow; }
      }
    }
    return items;
  }

  function drawCallout(svg, it, side) {
    // leader line: cell centroid -> label anchor (just outside the tile edge)
    const edge = side === "L" ? GUT : GUT + CHART;      // tile edge x in plot px
    const tx = side === "L" ? GUT - 8 : GUT + CHART + 8; // text anchor x
    const line = document.createElementNS(SVG_NS, "polyline");
    line.setAttribute("points",
      it.cx + "," + it.cy + " " + edge + "," + it.mid + " "
      + (side === "L" ? tx + 3 : tx - 3) + "," + it.mid);
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "var(--leader)");
    line.setAttribute("stroke-width", "0.6");
    svg.appendChild(line);

    const dot = document.createElementNS(SVG_NS, "circle");
    dot.setAttribute("cx", it.cx); dot.setAttribute("cy", it.cy);
    dot.setAttribute("r", "1.4"); dot.setAttribute("fill", "var(--leader)");
    svg.appendChild(dot);

    const text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("x", tx);
    text.setAttribute("y", it.top + LABEL_FS);
    text.setAttribute("font-size", LABEL_FS);
    text.setAttribute("font-family", "Arial, sans-serif");
    text.setAttribute("fill", "var(--fg)");
    text.setAttribute("text-anchor", side === "L" ? "end" : "start");
    it.lines.forEach(function (ln, i) {
      const ts = document.createElementNS(SVG_NS, "tspan");
      ts.setAttribute("x", tx);
      if (i > 0) ts.setAttribute("dy", LH);
      ts.textContent = ln;
      text.appendChild(ts);
    });
    svg.appendChild(text);
  }

  // ray-cast point-in-polygon; poly is [[ux,uy],...] in unit coords, scaled
  // by d to match the (x, y) test point in the node-local pixel frame.
  function inPoly(x, y, poly, d) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0] * d, yi = poly[i][1] * d,
            xj = poly[j][0] * d, yj = poly[j][1] * d;
      if (((yi > y) !== (yj > y))
          && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // For one tile: measure each leaf cell, keep the in-cell label when its
  // text box fits fully inside the polygon, otherwise hide it and emit a
  // leader-line callout in the gutter.
  function buildCallouts(ctx) {
    const series = ctx.series, svg = ctx.svg;
    const d = Math.min(series.innerWidth(), series.innerHeight()) / 2;
    const cx0 = series.innerWidth() / 2;   // chart-local center (~150)
    const maxLabelW = GUT - 12;
    const lefts = [], rights = [];

    // amCharts nests child DataItems under di.get("children"); walk to leaves.
    function visit(di) {
      const kids = di.get("children");
      if (kids && kids.length) { for (let i = 0; i < kids.length; i++) visit(kids[i]); return; }
      const dc = di.dataContext;
      const d3n = di.get("d3HierarchyNode");
      const label = di.get("label");
      if (!dc || !d3n || !d3n.polygon || !label) return;
      const coords = d3n.polygon, site = coords.site;
      if (!site) return;

      // does the label's box, centered at the cell site, sit inside the cell?
      const tw = textWidth(dc.name, CELL_FS);
      const sx = site.x * d, sy = site.y * d;
      const hw = tw / 2 + 2, hh = 6;
      const pts = [[sx - hw, sy - hh], [sx + hw, sy - hh], [sx + hw, sy + hh],
                   [sx - hw, sy + hh], [sx, sy - hh], [sx, sy + hh],
                   [sx - hw, sy], [sx + hw, sy]];
      let fits = true;
      for (const p of pts) { if (!inPoly(p[0], p[1], coords, d)) { fits = false; break; } }
      if (fits) return;  // keep amCharts' in-cell label

      label.set("forceHidden", true);
      const g = label.toGlobal({ x: 0, y: 0 });   // site, chart-div px
      const it = { name: dc.name, cx: GUT + g.x, cy: g.y };
      it.lines = wrapLabel(dc.name, maxLabelW);
      it.h = it.lines.length * LH + 2;
      (g.x < cx0 ? lefts : rights).push(it);
    }
    series.dataItems.forEach(visit);
    stack(lefts, 6, CHART - 6, 5).forEach(function (it) { drawCallout(svg, it, "L"); });
    stack(rights, 6, CHART - 6, 5).forEach(function (it) { drawCallout(svg, it, "R"); });
  }

  let doc = window.TREEMAP_DOC;
  if (!doc) { doc = await (await fetch("./doc.json")).json(); }

  const tiles = doc.tiles;
  const nCols = window.__COLS__ ||
    (tiles.length <= 3 ? tiles.length : Math.ceil(Math.sqrt(tiles.length)));
  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "repeat(" + nCols + ", auto)";

  let pending = tiles.length;
  const roots = [];
  const ctxs = [];

  tiles.forEach(function (tile, i) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = tile.label;
    const sub = document.createElement("div");
    sub.className = "subtitle";
    sub.textContent = "Φₘ = " + tile.Phi_M.toFixed(3)
      + " g·gDCW⁻¹,  d = " + tile.burden_factor.toFixed(2);

    // plot = chart (offset by the gutter) + a full-width callout overlay
    const plot = document.createElement("div");
    plot.className = "plot";
    plot.style.width = PLOTW + "px";
    plot.style.height = CHART + "px";
    const chartDiv = document.createElement("div");
    chartDiv.className = "chart";
    chartDiv.id = "chart" + i;
    chartDiv.style.left = GUT + "px";
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "callouts");
    svg.setAttribute("width", PLOTW);
    svg.setAttribute("height", CHART);
    plot.appendChild(chartDiv);
    plot.appendChild(svg);

    cell.appendChild(title);
    cell.appendChild(sub);
    cell.appendChild(plot);
    grid.appendChild(cell);

    const root = am5.Root.new(chartDiv.id);
    root._logo && root._logo.dispose();
    roots.push(root);

    const series = root.container.children.push(
      am5hierarchy.VoronoiTreemap.new(root, {
        shapeType: "polygon",
        valueField: "value",
        categoryField: "name",
        childDataField: "children",
        topDepth: 1,        // the four top-level pieces tessellate the area
        initialDepth: 2,    // ... and Metabolic is subdivided into its five
      })
    );
    ctxs.push({ series: series, svg: svg, chartDiv: chartDiv });

    // one hue per tile; each piece is a shade of tile.base_color
    series.polygons.template.adapters.add("fill", function (fill, target) {
      const dc = target.dataItem && target.dataItem.dataContext;
      return (dc && dc.piece && dc.piece in PIECE_SHADE)
        ? shade(tile.base_color, PIECE_SHADE[dc.piece]) : fill;
    });
    series.polygons.template.setAll({
      stroke: am5.color(0xffffff), strokeWidth: 1.2, strokeOpacity: 1,
    });

    // in-cell labels: every leaf keeps its name where it fits (buildCallouts
    // hides the ones that don't and draws them as gutter callouts instead).
    // The internal "Metabolic" grouping node (and the undrawn root) must NOT
    // be labeled -- their text would overlap the leaf labels.
    series.labels.template.setAll({
      text: "{category}", fontSize: CELL_FS, fill: am5.color(0x1a1a1a),
      oversizedBehavior: "none",
    });
    series.labels.template.adapters.add("forceHidden", function (hidden, target) {
      const dc = target.dataItem && target.dataItem.dataContext;
      // parent grouping nodes ("Metabolic" / root) are never labeled
      return (dc && dc.children && dc.children.length) ? true : hidden;
    });

    series.events.on("datavalidated", function () {
      pending -= 1;
      if (pending === 0) {
        // one settle frame so label.toGlobal / cell geometry are final,
        // then measure every tile and draw its callouts.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            ctxs.forEach(buildCallouts);
            window.__RENDER_DONE__ = true;
          });
        });
      }
    });

    series.data.setAll([{
      name: tile.label,
      children: pruneZeros(tile.children),
    }]);
  });

  // hue = campaign (per-tile title), shade = sector (in-cell + callout labels)

  // safety net: if no series fired (e.g. empty doc), still resolve
  if (tiles.length === 0) { window.__RENDER_DONE__ = true; }
})();
</script>
</body>
</html>
