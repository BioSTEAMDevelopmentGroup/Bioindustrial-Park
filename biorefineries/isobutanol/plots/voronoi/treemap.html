<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg: #1a1a1a; }
  html, body { margin: 0; background: #ffffff; color: var(--fg);
    font-family: Arial, "DejaVu Sans", sans-serif; }
  #figure { padding: 16px; }
  #grid { display: grid; gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .title { font-size: 13px; font-weight: bold; margin: 2px 0 0; }
  .cell .subtitle { font-size: 11px; color: #444; margin: 0 0 4px; }
  .chart { width: 300px; height: 300px; }
</style>
</head>
<body>
<div id="figure">
  <div id="grid"></div>
</div>
<script src="./vendor/am5.bundle.js"></script>
<script>
/* eslint-disable */
(async function () {
  // Each tile is a single hue (its campaign color, from Stage 1); every
  // piece is a shade of that one hue. The five metabolic categories form a
  // dark->light ramp (glycolysis darkest -> isobutanol lightest, echoing
  // parameter-sets panel C); housekeeping, translation and slack each get
  // their own fixed lightness. t > 0 lightens toward white, t < 0 darkens
  // toward black; the metabolic ramp reuses panel C's linspace(0, 0.66, 5).
  const PIECE_SHADE = {
    housekeeping: -0.25,
    cat_glycolysis: 0.00,
    cat_tca: 0.165,
    cat_acetate: 0.33,
    cat_ethanol: 0.495,
    cat_isobutanol: 0.66,
    translation: 0.78,
    slack: 0.90,
  };
  function shade(hex, t) {
    const h = hex.replace("#", "");
    let r = parseInt(h.slice(0, 2), 16),
        g = parseInt(h.slice(2, 4), 16),
        b = parseInt(h.slice(4, 6), 16);
    if (t >= 0) {
      r += (255 - r) * t; g += (255 - g) * t; b += (255 - b) * t;
    } else {
      const k = 1 + t; r *= k; g *= k; b *= k;
    }
    return am5.color((Math.round(r) << 16) | (Math.round(g) << 8)
      | Math.round(b));
  }

  let doc = window.TREEMAP_DOC;
  if (!doc) { doc = await (await fetch("./doc.json")).json(); }

  const tiles = doc.tiles;
  const nCols = window.__COLS__ ||
    (tiles.length <= 3 ? tiles.length : Math.ceil(Math.sqrt(tiles.length)));
  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "repeat(" + nCols + ", auto)";

  let pending = tiles.length;
  const roots = [];

  tiles.forEach(function (tile, i) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const chartDiv = document.createElement("div");
    chartDiv.className = "chart";
    chartDiv.id = "chart" + i;
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = tile.label;
    const sub = document.createElement("div");
    sub.className = "subtitle";
    sub.textContent = "\u03A6\u2098 = " + tile.Phi_M.toFixed(3)
      + " g\u00b7gDCW\u207b\u00b9,  d = " + tile.burden_factor.toFixed(2);
    cell.appendChild(title);
    cell.appendChild(sub);
    cell.appendChild(chartDiv);
    grid.appendChild(cell);

    const root = am5.Root.new(chartDiv.id);
    root._logo && root._logo.dispose();
    roots.push(root);

    const series = root.container.children.push(
      am5hierarchy.VoronoiTreemap.new(root, {
        shapeType: "polygon",
        valueField: "value",
        categoryField: "name",
        childDataField: "children",
        topDepth: 1,        // the four top-level pieces tessellate the area
        initialDepth: 2,    // ... and Metabolic is subdivided into its five
      })
    );

    // one hue per tile; each piece is a shade of tile.base_color
    series.polygons.template.adapters.add("fill", function (fill, target) {
      const dc = target.dataItem && target.dataItem.dataContext;
      return (dc && dc.piece && dc.piece in PIECE_SHADE)
        ? shade(tile.base_color, PIECE_SHADE[dc.piece]) : fill;
    });
    series.polygons.template.setAll({
      stroke: am5.color(0xffffff), strokeWidth: 1.2, strokeOpacity: 1,
    });

    // labels: leaf-cell name only, hidden when the slice is tiny. The
    // internal "Metabolic" grouping node (and the undrawn root) must NOT be
    // labeled -- otherwise "root"/"Metabolic" text overlaps the leaf labels
    // (seen in the Task-1 PoC). Hide any label whose data item has children.
    series.labels.template.setAll({
      text: "{category}", fontSize: 10, fill: am5.color(0x1a1a1a),
      oversizedBehavior: "hide",
    });
    series.labels.template.adapters.add("forceHidden", function (hidden, target) {
      const dc = target.dataItem && target.dataItem.dataContext;
      return (dc && dc.children && dc.children.length) ? true : hidden;
    });

    series.events.on("datavalidated", function () {
      pending -= 1;
      if (pending === 0) { window.__RENDER_DONE__ = true; }
    });

    series.data.setAll([{
      name: tile.label,
      children: tile.children,
    }]);
  });

  // no shared legend: hue = campaign (per-tile title), shade = sector
  // (leaf-cell labels inside each treemap)

  // safety net: if no series fired (e.g. empty doc), still resolve
  if (tiles.length === 0) { window.__RENDER_DONE__ = true; }
})();
</script>
</body>
</html>
